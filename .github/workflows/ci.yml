name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Set up uv
        # setup-uv publishes no major tags any more; pin the full version.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Check nas-app.toml
        run: uv run scripts/handoff.py --check

  # Builds and smoke-tests the image without pushing, so a broken Dockerfile
  # fails before merge. Also the only image build in the template repo.
  image-check:
    name: Image check
    if: github.event_name == 'pull_request' || github.repository == 'nulinspiratie/nas-app-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: image-check:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run as the NAS does and check /healthz
        run: |
          docker run -d --name app --read-only --tmpfs /tmp \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges:true \
            -p 8080:8080 "image-check:$GITHUB_SHA"
          for _ in $(seq 30); do
            body=$(curl -fsS http://127.0.0.1:8080/healthz) && break
            sleep 1
          done
          docker logs app
          echo "healthz: $body"
          test "$(echo "$body" | jq -r .status)" = ok
          test "$(echo "$body" | jq -r .version)" = "$GITHUB_SHA"
          test "$(docker exec app id -u):$(docker exec app id -g)" = 1000:1000

  publish:
    name: Publish image
    needs: [test]
    # Never publish from the template repo itself, only from repos made from it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != 'nulinspiratie/nas-app-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
