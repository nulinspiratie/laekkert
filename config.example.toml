# App settings. Every setting is listed here with its default.
# Copied to containers/<slug>/config.toml in home-server and mounted read-only
# at /config/config.toml. Never put secrets here: they are env vars, declared
# in nas-app.toml.

# Copy the bundled example recipes into the data folder when it has no recipes yet.
seed_examples = true

# Tags shown as one-tap filters at the top of the Food page, in this order.
# Tags no food recipe uses are left out. [] shows no tag row.
food_quick_tags = ["breakfast", "dinner", "kid approved", "quick", "vegetarian"]
