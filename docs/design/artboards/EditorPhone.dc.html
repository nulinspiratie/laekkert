<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New recipe, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFE3}
a{color:#8E3E20}a:hover{color:#6E2E16}
button,input,select,textarea{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 2100px; overflow: hidden; background: #F5EFE3; color: #2A231E; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 8px; padding: 20px 12px 12px; border-bottom: 1px solid #E2D6C1; background: #F9F4EA">
    <a href="FoodGridPhone.dc.html" aria-label="Close without saving" style="width: 48px; height: 48px; border-radius: 50%; color: #2A231E; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px; line-height: 1.1">New recipe</h1>
      <span style="font-size: 13px; color: #66594C">Adding to Food</span>
    </div>
  </header>

  <form style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px 24px">

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 180px; border: 2px dashed #CDB59C; border-radius: 18px; background: #FBF6EC; color: #8E3E20; cursor: pointer">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      <span style="font-size: 17px; font-weight: 600">Add a photo</span>
      <span style="font-size: 14px; color: #66594C">Take one or choose from your library</span>
    </button>

    <section aria-label="Basics" style="display: flex; flex-direction: column; gap: 14px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600; color: #4F443A">Name</span>
        <input type="text" value="Pannenkoeken" placeholder="Recipe name" style="box-sizing: border-box; width: 100%; min-height: 54px; padding: 0 14px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-family: 'Young Serif', Georgia, serif; font-size: 22px">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 600; color: #4F443A">Category</span>
        <select value="Breakfast" style="min-height: 52px; padding: 0 12px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px">
          <option>Mains</option><option>Soups</option><option>Breakfast</option><option>Baking</option><option>Sides</option>
        </select>
      </label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; font-weight: 600; color: #4F443A">Cooking time</span>
          <span style="display: flex; align-items: center; min-height: 52px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; overflow: hidden">
            <input type="number" inputmode="numeric" value="20" style="flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 12px; background: transparent; font-size: 16px">
            <span style="padding: 0 12px; color: #66594C">min</span>
          </span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; font-weight: 600; color: #4F443A">Servings</span>
          <input type="number" inputmode="numeric" value="4" style="min-height: 52px; padding: 0 12px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px">
        </label>
      </div>
    </section>

    <section aria-labelledby="ph-ing" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="ph-ing" style="margin: 4px 0 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">Ingredients</h2>
      <sc-for list="{{ingredients}}" as="i" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 14px">
          <div style="display: grid; grid-template-columns: 68px 92px minmax(0, 1fr); gap: 8px">
            <input type="text" inputmode="decimal" aria-label="Amount" value="{{i.amount}}" placeholder="Amt" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 10px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-weight: 600; text-align: right">
            <select aria-label="Unit" value="{{i.unit}}" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 6px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFFFF; font-size: 16px">
              <option>g</option><option>ml</option><option>tsp</option><option>tbsp</option><option>whole</option><option>to taste</option>
            </select>
            <input type="text" aria-label="Ingredient" value="{{i.item}}" placeholder="Ingredient" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFFFF; font-size: 16px">
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <input type="text" aria-label="Note" value="{{i.note}}" placeholder="Note (optional)" style="box-sizing: border-box; flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid #E2D6C1; border-radius: 10px; background: #FFFFFF; font-size: 15px; color: #4F443A">
            <button type="button" aria-pressed="{{i.fixed}}" onClick="{{i.toggle}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border: 1px solid {{i.border}}; border-radius: 10px; background: {{i.bg}}; color: {{i.fg}}; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">
              <span aria-hidden="true" style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 6px; border: 2px solid {{i.boxBorder}}; background: {{i.boxBg}}; color: #FFF8F1; display: flex; align-items: center; justify-content: center">
                <sc-if value="{{i.fixed}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
              </span>
              Don't scale
            </button>
            <button type="button" aria-label="Remove ingredient" onClick="{{i.remove}}" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #6B5D4F; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
      <button type="button" onClick="{{addIngredient}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1px dashed #C9A894; border-radius: 14px; background: transparent; color: #8E3E20; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Add ingredient
      </button>
    </section>

    <section aria-labelledby="ph-steps" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="ph-steps" style="margin: 4px 0 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">Steps</h2>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="2">
          <li style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 44px; gap: 8px; align-items: start">
            <span aria-hidden="true" style="width: 36px; height: 36px; margin-top: 6px; border-radius: 50%; background: #F1DDD0; color: #8E3E20; display: flex; align-items: center; justify-content: center; font-family: 'Young Serif', Georgia, serif; font-size: 17px">{{st.n}}</span>
            <textarea aria-label="Step {{st.n}}" rows="3" value="{{st.text}}" placeholder="Describe this step" style="box-sizing: border-box; width: 100%; min-height: 96px; padding: 12px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px; line-height: 1.5; resize: vertical"></textarea>
            <button type="button" aria-label="Remove step {{st.n}}" onClick="{{st.remove}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #6B5D4F; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg>
            </button>
          </li>
        </sc-for>
      </ol>
      <button type="button" onClick="{{addStep}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1px dashed #C9A894; border-radius: 14px; background: transparent; color: #8E3E20; font-weight: 600; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Add step
      </button>
    </section>

    <section aria-labelledby="ph-tags" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="ph-tags" style="margin: 4px 0 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">Tags</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 2px 0 14px; border-radius: 999px; background: #F1DDD0; color: #7A3419; font-weight: 600; font-size: 15px">Weeknight
          <button type="button" aria-label="Remove tag Weeknight" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </span>
        <span style="display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 2px 0 14px; border-radius: 999px; background: #F1DDD0; color: #7A3419; font-weight: 600; font-size: 15px">Dutch
          <button type="button" aria-label="Remove tag Dutch" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </span>
      </div>
      <label style="display: flex">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add a tag</span>
        <input type="text" placeholder="Add a tag" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px">
      </label>
    </section>

    <section aria-labelledby="ph-src" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="ph-src" style="margin: 4px 0 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">Source</h2>
      <div role="radiogroup" aria-label="Source type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EBE0CD; border-radius: 14px">
        <sc-for list="{{sources}}" as="o" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 44px; border: 0; border-radius: 10px; background: {{o.bg}}; color: {{o.fg}}; font-weight: 600; cursor: pointer">{{o.name}}</button>
        </sc-for>
      </div>
      <sc-if value="{{srcLink}}" hint-placeholder-val="{{true}}">
        <label style="display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Source link</span>
          <input type="url" placeholder="Paste a link" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px">
        </label>
      </sc-if>
      <sc-if value="{{srcPhoto}}" hint-placeholder-val="{{false}}">
        <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border: 2px dashed #CDB59C; border-radius: 14px; background: #FBF6EC; color: #8E3E20; font-weight: 600; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          Photograph the page or card
        </button>
      </sc-if>
    </section>
  </form>

  <div style="padding: 12px 16px 30px; border-top: 1px solid #E2D6C1; background: #F9F4EA; box-shadow: 0 -8px 24px rgba(60,40,20,.08)">
    <a href="RecipePhone.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 16px; background: #B0502C; color: #FFF8F1; text-decoration: none; font-size: 17px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
      Save recipe
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      nextId: 5,
      ings: [
        { id: 1, amount: '250', unit: 'g', item: 'flour', note: '', fixed: false },
        { id: 2, amount: '500', unit: 'ml', item: 'milk', note: '', fixed: false },
        { id: 3, amount: '3', unit: 'whole', item: 'eggs', note: '', fixed: false },
        { id: 4, amount: '', unit: 'to taste', item: 'salt', note: 'a pinch', fixed: true }
      ],
      steps: [
        { id: 1, text: 'Whisk the flour, eggs and half the milk into a smooth batter, then whisk in the rest of the milk and the salt.' },
        { id: 2, text: '' }
      ],
      source: 'Link'
    };
  }
  renderVals() {
    const s = this.state;
    const ingredients = s.ings.map((i) => ({
      ...i,
      bg: i.fixed ? '#F1DDD0' : '#FFFFFF',
      fg: i.fixed ? '#7A3419' : '#4F443A',
      border: i.fixed ? '#E5C2AE' : '#E2D6C1',
      boxBg: i.fixed ? '#B0502C' : '#FFFFFF',
      boxBorder: i.fixed ? '#B0502C' : '#B5A38A',
      toggle: () => this.setState({ ings: this.state.ings.map((x) => (x.id === i.id ? { ...x, fixed: !x.fixed } : x)) }),
      remove: () => this.setState({ ings: this.state.ings.filter((x) => x.id !== i.id) })
    }));
    const steps = s.steps.map((st, idx) => ({
      ...st,
      n: idx + 1,
      remove: () => this.setState({ steps: this.state.steps.filter((x) => x.id !== st.id) })
    }));
    const sources = ['Link', 'Photo', 'None'].map((name) => {
      const on = s.source === name;
      return { name, on, bg: on ? '#FFFCF6' : 'transparent', fg: on ? '#2A231E' : '#5E5245', pick: () => this.setState({ source: name }) };
    });
    return {
      ingredients, steps, sources,
      srcLink: s.source === 'Link', srcPhoto: s.source === 'Photo',
      addIngredient: () => this.setState({
        nextId: s.nextId + 1,
        ings: [...s.ings, { id: s.nextId, amount: '', unit: 'g', item: '', note: '', fixed: false }]
      }),
      addStep: () => this.setState({
        nextId: s.nextId + 1,
        steps: [...s.steps, { id: s.nextId, text: '' }]
      })
    };
  }
}
</script>
</body>
</html>
