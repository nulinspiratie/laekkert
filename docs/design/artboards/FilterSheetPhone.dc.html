<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food filters, phone sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFE3}
a{color:#8E3E20}a:hover{color:#6E2E16}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5EFE3; color: #2A231E; font-family: 'Hanken Grotesk', system-ui, sans-serif">

  <div aria-hidden="true" style="padding: 28px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="font-family: 'Young Serif', Georgia, serif; font-size: 34px; line-height: 1.05">Food</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="height: 230px; border-radius: 14px; background: #FFFCF6; border: 1px solid #E2D6C1; overflow: hidden"><div style="height: 128px; background: #D7A95E"></div></div>
      <div style="height: 230px; border-radius: 14px; background: #FFFCF6; border: 1px solid #E2D6C1; overflow: hidden"><div style="height: 128px; background: #C9A15A"></div></div>
    </div>
  </div>
  <a href="FoodGridPhone.dc.html" aria-label="Close filters" style="position: absolute; inset: 0; background: rgba(30,22,16,.5)"></a>

  <div role="dialog" aria-modal="true" aria-labelledby="sheet-h" style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: #F9F4EA; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(30,22,16,.25); display: flex; flex-direction: column">
    <div aria-hidden="true" style="display: flex; justify-content: center; padding-top: 10px"><div style="width: 40px; height: 5px; border-radius: 3px; background: #CDBFA8"></div></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 20px">
      <h2 id="sheet-h" style="flex: 1; margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 26px">Filters</h2>
      <button type="button" onClick="{{reset}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #8E3E20; font-weight: 600; cursor: pointer">Reset</button>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 24px">

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h3 style="margin: 0 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Marks</h3>
        <sc-for list="{{marks}}" as="m" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{m.on}}" onClick="{{m.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 14px; border: 1px solid {{m.border}}; border-radius: 14px; background: {{m.bg}}; color: {{m.fg}}; font-size: 17px; font-weight: 600; text-align: left; cursor: pointer">
            <sc-if value="{{m.isFav}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></sc-if>
            <sc-if value="{{m.isKid}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M9 14.5c.8.9 1.8 1.4 3 1.4s2.2-.5 3-1.4"></path><circle cx="9.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><circle cx="14.5" cy="10" r="1" fill="currentColor" stroke="none"></circle></svg></sc-if>
            <sc-if value="{{m.isNext}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg></sc-if>
            <span style="flex: 1">{{m.label}}</span>
            <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; border: 2px solid {{m.boxBorder}}; background: {{m.boxBg}}; box-sizing: border-box; color: #FFF8F1; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
            </span>
          </button>
        </sc-for>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Category</h3>
        <div role="radiogroup" aria-label="Category" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
            <button type="button" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 16px; border: 1px solid {{c.border}}; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 600; cursor: pointer">{{c.name}}</button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Tags</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
            <button type="button" aria-pressed="{{t.on}}" onClick="{{t.toggle}}" style="min-height: 44px; padding: 0 16px; border: 1px solid {{t.border}}; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 600; cursor: pointer">{{t.name}}</button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Cook with what you have</h3>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 6px 0 14px; background: #FFFCF6; border: 1px solid #D9CBB4; border-radius: 12px">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add an ingredient</span>
          <input type="text" placeholder="Add an ingredient" style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 16px">
          <button type="button" aria-label="Add ingredient" style="width: 40px; height: 40px; border: 0; border-radius: 9px; background: #F1DDD0; color: #8E3E20; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </label>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <span style="display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 2px 0 14px; border-radius: 999px; background: #F1DDD0; color: #7A3419; font-weight: 600; font-size: 15px">leek
            <button type="button" aria-label="Remove leek" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
          </span>
          <span style="display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 2px 0 14px; border-radius: 999px; background: #F1DDD0; color: #7A3419; font-weight: 600; font-size: 15px">potatoes
            <button type="button" aria-label="Remove potatoes" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
          </span>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Sort by</h3>
        <div role="radiogroup" aria-label="Sort by" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EBE0CD; border-radius: 14px">
          <sc-for list="{{sorts}}" as="o" hint-placeholder-count="4">
            <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 44px; border: 0; border-radius: 10px; background: {{o.bg}}; color: {{o.fg}}; font-size: 14px; font-weight: 600; cursor: pointer">{{o.name}}</button>
          </sc-for>
        </div>
      </section>
    </div>

    <div style="padding: 12px 16px 30px; border-top: 1px solid #E2D6C1; background: #F9F4EA">
      <a href="FoodGridPhone.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #B0502C; color: #FFF8F1; text-decoration: none; font-size: 17px; font-weight: 700">Show {{count}} recipes</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fav: false, kid: true, next: false, cat: 'All', tags: { Weeknight: true }, sort: 'Time' };
  }
  renderVals() {
    const s = this.state;
    const on = { bg: '#F1DDD0', fg: '#7A3419', border: '#E5C2AE' };
    const off = { bg: '#FFFCF6', fg: '#2A231E', border: '#D9CBB4' };
    const marks = [
      { key: 'fav', label: 'Favourite' },
      { key: 'kid', label: 'Kid approved' },
      { key: 'next', label: 'Try next' }
    ].map((m) => {
      const v = !!s[m.key];
      const st = v ? on : off;
      return {
        ...m, on: v,
        isFav: m.key === 'fav', isKid: m.key === 'kid', isNext: m.key === 'next',
        bg: st.bg, fg: st.fg, border: st.border,
        boxBg: v ? '#B0502C' : '#FFFFFF', boxBorder: v ? '#B0502C' : '#B5A38A',
        toggle: () => this.setState({ [m.key]: !v })
      };
    });
    const catCounts = { All: 42, Mains: 24, Soups: 6, Breakfast: 5, Baking: 4, Sides: 3 };
    const cats = Object.keys(catCounts).map((name) => {
      const v = s.cat === name;
      return {
        name, on: v,
        bg: v ? '#B0502C' : '#FFFCF6', fg: v ? '#FFF8F1' : '#2A231E', border: v ? '#B0502C' : '#D9CBB4',
        pick: () => this.setState({ cat: name })
      };
    });
    const tags = ['Weeknight', 'Vegetarian', 'One-pot', 'Freezer-friendly', 'Dutch', 'Mild'].map((name) => {
      const v = !!s.tags[name];
      const st = v ? on : off;
      return { name, on: v, bg: st.bg, fg: st.fg, border: st.border, toggle: () => this.setState({ tags: { ...this.state.tags, [name]: !v } }) };
    });
    const sorts = ['Time', 'Rating', 'Recent', 'A–Z'].map((name) => {
      const v = s.sort === name;
      return { name, on: v, bg: v ? '#FFFCF6' : 'transparent', fg: v ? '#2A231E' : '#5E5245', pick: () => this.setState({ sort: name }) };
    });
    let n = catCounts[s.cat];
    if (s.kid) n = Math.ceil(n * 0.45);
    if (s.fav) n = Math.ceil(n * 0.4);
    if (s.next) n = Math.ceil(n * 0.3);
    Object.keys(s.tags).forEach((k) => { if (s.tags[k]) n = Math.ceil(n * 0.6); });
    n = Math.ceil(n * 0.5);
    return {
      marks, cats, tags, sorts, count: n,
      reset: () => this.setState({ fav: false, kid: false, next: false, cat: 'All', tags: {}, sort: 'Time' })
    };
  }
}
</script>
</body>
</html>
