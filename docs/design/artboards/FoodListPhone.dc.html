<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food, list view, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFE3}
a{color:#8E3E20}a:hover{color:#6E2E16}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5EFE3; color: #2A231E; font-family: 'Hanken Grotesk', system-ui, sans-serif">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 28px 16px 0">
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.05">Food</h1>
        <p style="margin: 0; font-size: 15px; color: #66594C">Kid approved, quickest first</p>
      </div>
      <button type="button" aria-label="Search food" style="width: 48px; height: 48px; border: 1px solid #D9CBB4; border-radius: 50%; background: #FFFCF6; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 14px; overflow: hidden">
      <sc-for list="{{recipes}}" as="r" hint-placeholder-count="9">
        <a href="RecipePhone.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 8px 12px; box-sizing: border-box; border-bottom: 1px solid #EFE6D6; text-decoration: none; color: #2A231E">
          <sc-if value="{{r.photo}}" hint-placeholder-val="{{true}}">
            <div role="img" aria-label="Photo of {{r.name}}" style="flex: none; width: 52px; height: 52px; border-radius: 10px; background-color: {{r.tone}}; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 2px, transparent 2px 9px)"></div>
          </sc-if>
          <sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{false}}">
            <div style="flex: none; width: 52px; height: 52px; border-radius: 10px; background: #B0502C; color: #F6E2D4; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{r.isBowl}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 22h34a17 17 0 0 1-34 0z"></path><path d="M18 39h12"></path><path d="M19 16c0-3 3-3 3-6M26 16c0-3 3-3 3-6"></path></svg></sc-if>
              <sc-if value="{{r.isPot}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 18h28v15a7 7 0 0 1-7 7H17a7 7 0 0 1-7-7z"></path><path d="M5 18h5M38 18h5M19 13h10M24 13v-3"></path></svg></sc-if>
              <sc-if value="{{r.isPlate}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="25" r="12"></circle><circle cx="24" cy="25" r="7"></circle><path d="M6 12v7a3 3 0 0 0 3 3v15M9 12v7M42 12c-3 0-4 4-4 9h4v16"></path></svg></sc-if>
            </div>
          </sc-if>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-family: 'Young Serif', Georgia, serif; font-size: 16px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5E5245">
              <span>{{r.time}}</span>
              <span aria-hidden="true">·</span>
              <span style="display: flex; align-items: center; gap: 3px"><svg width="13" height="13" viewBox="0 0 24 24" fill="#C98A2B" stroke="#C98A2B" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"></path></svg>{{r.rating}}</span>
            </span>
          </div>
          <span style="flex: none; display: flex; gap: 6px; color: #8E3E20">
            <sc-if value="{{r.fav}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" role="img" aria-label="Favourite"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></sc-if>
            <sc-if value="{{r.kid}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" role="img" aria-label="Kid approved"><circle cx="12" cy="12" r="8"></circle><path d="M9 14.5c.8.9 1.8 1.4 3 1.4s2.2-.5 3-1.4"></path><circle cx="9.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><circle cx="14.5" cy="10" r="1" fill="currentColor" stroke="none"></circle></svg></sc-if>
            <sc-if value="{{r.next}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" role="img" aria-label="Try next"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg></sc-if>
          </span>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: #F9F4EA; border-top: 1px solid #E2D6C1; box-shadow: 0 -8px 24px rgba(60,40,20,.08); display: flex; align-items: center; gap: 8px">
    <nav aria-label="Food or drinks" style="flex: 1; display: flex; gap: 4px; padding: 4px; background: #EBE0CD; border-radius: 999px">
      <a href="FoodListPhone.dc.html" aria-current="page" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; background: #B0502C; color: #FFF8F1; text-decoration: none; font-weight: 600">Food</a>
      <a href="DrinksPhone.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; color: #5E5245; text-decoration: none; font-weight: 600">Drinks</a>
    </nav>
    <a href="FilterSheetPhone.dc.html" aria-label="Filters, 1 active" style="position: relative; width: 52px; height: 52px; border-radius: 50%; border: 1px solid #D9CBB4; background: #FFFCF6; color: #2A231E; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span aria-hidden="true" style="position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; border-radius: 10px; background: #B0502C; color: #FFF8F1; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
    </a>
    <a href="FoodGridPhone.dc.html" aria-label="Switch to grid view" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #D9CBB4; background: #FFFCF6; color: #2A231E; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
    </a>
    <a href="EditorDesktop.dc.html" aria-label="New recipe" style="width: 52px; height: 52px; border-radius: 50%; background: #B0502C; color: #FFF8F1; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const recipes = [
      { name: 'Pannenkoeken', time: '20 min', rating: '4.5', photo: true, tone: '#D7A95E', fav: true, kid: true },
      { name: 'Veggie quesadillas', time: '20 min', rating: '4.0', photo: true, tone: '#C9A15A', kid: true },
      { name: 'Egg fried rice', time: '25 min', rating: '4.0', icon: 'bowl', kid: true, next: true },
      { name: 'Fish fingers & smashed peas', time: '25 min', rating: '3.5', photo: true, tone: '#9DAF6E', kid: true },
      { name: 'Red lentil dal', time: '35 min', rating: '4.5', photo: true, tone: '#D08A3C', fav: true, kid: true },
      { name: 'Tomato soup & grilled cheese', time: '35 min', rating: '4.0', icon: 'pot', kid: true },
      { name: 'Stamppot boerenkool', time: '45 min', rating: '4.0', icon: 'plate', kid: true },
      { name: 'Sheet-pan chicken & potatoes', time: '50 min', rating: '4.5', photo: true, tone: '#B9824B', fav: true, kid: true }
    ].map((r) => ({
      ...r,
      photo: !!r.photo, noPhoto: !r.photo,
      isBowl: r.icon === 'bowl', isPot: r.icon === 'pot', isPlate: r.icon === 'plate',
      fav: !!r.fav, kid: !!r.kid, next: !!r.next
    }));
    return { recipes };
  }
}
</script>
</body>
</html>
