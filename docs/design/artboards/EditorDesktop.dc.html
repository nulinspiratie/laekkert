<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit recipe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFE3}
a{color:#8E3E20}a:hover{color:#6E2E16}
button,input,select,textarea{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5EFE3; color: #2A231E; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 32px; background: #F9F4EA; border-bottom: 1px solid #E2D6C1">
    <a href="RecipeDesktop.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 16px; border-radius: 12px; color: #2A231E; text-decoration: none; font-weight: 600">Cancel</a>
    <h1 style="flex: 1; margin: 0; text-align: center; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">Edit recipe</h1>
    <a href="RecipeDesktop.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 12px; background: #B0502C; color: #FFF8F1; text-decoration: none; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
      Save
    </a>
  </header>

  <main style="width: 100%; max-width: 1240px; margin: 0 auto; box-sizing: border-box; padding: 32px 32px 80px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

    <div style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

      <section aria-label="Basics" style="background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; font-weight: 600; color: #4F443A">Name</span>
          <input type="text" value="Red lentil dal" style="box-sizing: border-box; width: 100%; min-height: 56px; padding: 0 16px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-family: 'Young Serif', Georgia, serif; font-size: 26px">
        </label>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 16px">
          <label style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 14px; font-weight: 600; color: #4F443A">Category</span>
            <select style="min-height: 48px; padding: 0 12px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px">
              <option>Mains</option><option>Soups</option><option>Breakfast</option><option>Baking</option><option>Sides</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 14px; font-weight: 600; color: #4F443A">Cooking time</span>
            <span style="display: flex; align-items: center; min-height: 48px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; overflow: hidden">
              <input type="number" value="35" style="flex: 1; min-width: 0; border: 0; outline: 0; padding: 0 12px; background: transparent; font-size: 16px">
              <span style="padding: 0 14px; color: #66594C">min</span>
            </span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 14px; font-weight: 600; color: #4F443A">Servings</span>
            <input type="number" value="4" style="min-height: 48px; padding: 0 12px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px">
          </label>
        </div>
      </section>

      <section aria-labelledby="ed-ing" style="background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
        <h2 id="ed-ing" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 26px">Ingredients</h2>
        <div style="overflow-x: auto">
          <div style="min-width: 700px; display: flex; flex-direction: column; gap: 8px">
            <div aria-hidden="true" style="display: grid; grid-template-columns: 24px 80px 104px minmax(0, 1.4fr) minmax(0, 1fr) 76px 44px; gap: 8px; align-items: end; padding: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6B5D4F">
              <span></span><span>Amount</span><span>Unit</span><span>Ingredient</span><span>Note</span><span style="text-align: center">Don't scale</span><span></span>
            </div>
            <sc-for list="{{ingredients}}" as="i" hint-placeholder-count="12">
              <div style="display: grid; grid-template-columns: 24px 80px 104px minmax(0, 1.4fr) minmax(0, 1fr) 76px 44px; gap: 8px; align-items: center">
                <span aria-hidden="true" style="display: flex; justify-content: center; color: #9A8B7B; cursor: grab">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
                </span>
                <input type="text" aria-label="Amount for {{i.item}}" value="{{i.amount}}" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 10px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-weight: 600; text-align: right">
                <select aria-label="Unit for {{i.item}}" value="{{i.unit}}" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 8px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFFFF; font-size: 16px">
                  <option>g</option><option>ml</option><option>tsp</option><option>tbsp</option><option>whole</option><option>to taste</option>
                </select>
                <input type="text" aria-label="Ingredient" value="{{i.item}}" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFFFF; font-size: 16px">
                <input type="text" aria-label="Note for {{i.item}}" value="{{i.note}}" placeholder="Note" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFFFF; font-size: 16px; color: #4F443A">
                <span style="display: flex; justify-content: center">
                  <button type="button" aria-label="Don't scale {{i.item}}" aria-pressed="{{i.fixed}}" onClick="{{i.toggle}}" style="width: 48px; height: 48px; border: 1px solid {{i.boxBorder}}; border-radius: 10px; background: {{i.boxBg}}; color: #FFF8F1; display: flex; align-items: center; justify-content: center; cursor: pointer">
                    <sc-if value="{{i.fixed}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
                  </button>
                </span>
                <button type="button" aria-label="Remove {{i.item}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #6B5D4F; display: flex; align-items: center; justify-content: center; cursor: pointer">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
                </button>
              </div>
            </sc-for>
          </div>
        </div>
        <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 1px dashed #C9A894; border-radius: 12px; background: transparent; color: #8E3E20; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add ingredient
        </button>
      </section>

      <section aria-labelledby="ed-steps" style="background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
        <h2 id="ed-steps" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 26px">Steps</h2>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
            <li style="display: grid; grid-template-columns: 24px 40px minmax(0, 1fr) 44px; gap: 10px; align-items: start">
              <span aria-hidden="true" style="display: flex; justify-content: center; padding-top: 12px; color: #9A8B7B; cursor: grab">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
              </span>
              <span aria-hidden="true" style="width: 40px; height: 40px; margin-top: 2px; border-radius: 50%; background: #F1DDD0; color: #8E3E20; display: flex; align-items: center; justify-content: center; font-family: 'Young Serif', Georgia, serif; font-size: 18px">{{st.n}}</span>
              <textarea aria-label="Step {{st.n}}" rows="2" style="box-sizing: border-box; width: 100%; min-height: 76px; padding: 12px 14px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px; line-height: 1.5; resize: vertical" value="{{st.text}}"></textarea>
              <button type="button" aria-label="Remove step {{st.n}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #6B5D4F; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
              </button>
            </li>
          </sc-for>
        </ol>
        <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 1px dashed #C9A894; border-radius: 12px; background: transparent; color: #8E3E20; font-weight: 600; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add step
        </button>
      </section>
    </div>

    <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

      <section aria-labelledby="ed-photo" style="background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <h2 id="ed-photo" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 22px">Photo</h2>
        <div role="img" aria-label="Current photo of red lentil dal" style="aspect-ratio: 4 / 3; border-radius: 12px; background-color: #D08A3C; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.10) 0 2px, transparent 2px 12px)"></div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-weight: 600; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
            Replace
          </button>
          <button type="button" style="min-height: 48px; padding: 0 16px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-weight: 600; cursor: pointer">Remove</button>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #66594C">Without a photo, the recipe shows a terracotta tile with a dish icon.</p>
      </section>

      <section aria-labelledby="ed-src" style="background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <h2 id="ed-src" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 22px">Source</h2>
        <div role="radiogroup" aria-label="Source type" style="display: flex; gap: 4px; padding: 4px; background: #F1E8D9; border-radius: 12px">
          <button type="button" role="radio" aria-checked="false" style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; color: #4F443A; cursor: pointer">Link</button>
          <button type="button" role="radio" aria-checked="true" style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: #FFFCF6; font-weight: 600; box-shadow: 0 1px 2px rgba(60,40,20,.12); cursor: pointer">Photo</button>
          <button type="button" role="radio" aria-checked="false" style="flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; color: #4F443A; cursor: pointer">None</button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid #E2D6C1; border-radius: 12px; background: #FFFFFF">
          <div role="img" aria-label="Cookbook page photo" style="flex: none; width: 44px; height: 58px; border-radius: 6px; background-color: #E9DDC6; background-image: repeating-linear-gradient(0deg, rgba(90,70,50,.18) 0 1px, transparent 1px 6px)"></div>
          <span style="flex: 1; min-width: 0; font-size: 15px">cookbook-page.jpg</span>
          <button type="button" style="min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #8E3E20; font-weight: 600; cursor: pointer">Replace</button>
        </div>
      </section>

      <section aria-labelledby="ed-tags" style="background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <h2 id="ed-tags" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 22px">Tags</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{tags}}" as="t" hint-placeholder-count="4">
            <span style="display: flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 2px 0 14px; border-radius: 999px; background: #F1DDD0; color: #7A3419; font-weight: 600; font-size: 15px">
              {{t}}
              <button type="button" aria-label="Remove tag {{t}}" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
              </button>
            </span>
          </sc-for>
        </div>
        <label style="display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add a tag</span>
          <input type="text" placeholder="Add a tag" style="box-sizing: border-box; width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid #D9CBB4; border-radius: 12px; background: #FFFFFF; font-size: 16px">
        </label>
      </section>

      <button type="button" style="align-self: flex-start; min-height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; color: #A1321B; font-weight: 600; cursor: pointer">Delete recipe</button>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fixed: { 7: true, 11: true } };
  }
  renderVals() {
    const rows = [
      ['250', 'g', 'red lentils', 'rinsed'],
      ['1', 'whole', 'onion', 'finely chopped'],
      ['3', 'whole', 'garlic cloves', 'grated'],
      ['1', 'tbsp', 'fresh ginger', 'grated'],
      ['1', 'tsp', 'cumin seeds', ''],
      ['1', 'tsp', 'ground turmeric', ''],
      ['½', 'tsp', 'chili flakes', 'go lighter for the kids'],
      ['2', 'tbsp', 'neutral oil', ''],
      ['400', 'ml', 'coconut milk', ''],
      ['750', 'ml', 'water', ''],
      ['1', 'whole', 'lime', 'juiced'],
      ['', 'to taste', 'salt', '']
    ];
    const fx = this.state.fixed;
    const ingredients = rows.map(([amount, unit, item, note], idx) => {
      const fixed = !!fx[idx];
      return {
        amount, unit, item, note, fixed,
        boxBg: fixed ? '#B0502C' : '#FFFFFF',
        boxBorder: fixed ? '#B0502C' : '#C9B79C',
        toggle: () => this.setState({ fixed: { ...this.state.fixed, [idx]: !fixed } })
      };
    });
    const steps = [
      'Heat the oil in a large pan over medium heat. Fry the cumin seeds until they crackle, about 30 seconds.',
      'Add the onion with a pinch of salt and cook for 8 minutes until soft and golden. Stir in the garlic, ginger, turmeric and chili flakes for 1 minute.',
      'Add the lentils, coconut milk and water. Bring to a boil, then simmer uncovered for 20 minutes, stirring now and then, until the lentils have broken down.',
      'Season with salt and the lime juice. Loosen with a splash of water if it is too thick.',
      'Serve with rice or warm flatbread. Keeps 3 days in the fridge and freezes well.'
    ].map((text, i) => ({ n: i + 1, text }));
    const tags = ['Weeknight', 'Vegetarian', 'One-pot', 'Freezer-friendly'];
    return { ingredients, steps, tags };
  }
}
</script>
</body>
</html>
