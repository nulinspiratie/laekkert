<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Drink recipe, phone: Daiquiri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E8E3D5}
a{color:#234836}a:hover{color:#16301F}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1500px; overflow: hidden; background: #E8E3D5; color: #1E2621; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="position: relative; height: 260px; flex: none; background: #2E5A44; color: #D9E6D6; display: flex; align-items: center; justify-content: center">
    <div aria-hidden="true" style="position: absolute; inset: 14px 14px 34px; border: 1px solid rgba(217,230,214,.3); border-radius: 12px"></div>
    <svg width="120" height="120" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Coupe glass, no photo yet" style="margin-bottom: 20px"><path d="M9 14h30c0 8-6.5 13-15 13S9 22 9 14z"></path><path d="M24 27v11M17 38h14"></path></svg>
    <div style="position: absolute; top: 20px; left: 16px; right: 16px; display: flex; justify-content: space-between">
      <a href="DrinksPhone.dc.html" aria-label="Back to Drinks" style="width: 48px; height: 48px; border-radius: 50%; background: #F5F1E6; color: #1E2621; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
      </a>
      <a href="EditorDesktop.dc.html" aria-label="Edit recipe" style="width: 48px; height: 48px; border-radius: 50%; background: #F5F1E6; color: #1E2621; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="m13.5 6.5 4 4"></path></svg>
      </a>
    </div>
  </div>

  <div style="position: relative; margin-top: -20px; border-radius: 20px 20px 0 0; background: #E8E3D5; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 26px">

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #4E554B">Cocktails · 5 min</div>
      <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 38px; line-height: 1.05">Daiquiri</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <a href="DrinksPhone.dc.html" style="display: flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid #CFC7B2; border-radius: 999px; background: #F5F1E6; color: #1E2621; text-decoration: none; font-size: 14px">classic</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; border: 1px solid #B9CDB8; border-radius: 14px; background: #D3E0D2; color: #1F4231; font-size: 13px; font-weight: 600; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
          Favourite
        </button>
        <button type="button" aria-pressed="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; border: 1px solid #B9CDB8; border-radius: 14px; background: #D3E0D2; color: #1F4231; font-size: 13px; font-weight: 600; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m8.5 12.5 2.5 2.5 4.5-5"></path></svg>
          Tried
        </button>
        <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 64px; border: 1px solid #CFC7B2; border-radius: 14px; background: #F5F1E6; color: #1E2621; font-size: 13px; font-weight: 600; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg>
          Try next
        </button>
      </div>
    </div>

    <section aria-labelledby="ding-h" style="background: #F5F1E6; border: 1px solid #D2CBB8; border-radius: 18px; padding: 18px 14px 8px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <h2 id="ding-h" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">Ingredients</h2>
        <div role="group" aria-label="Drinks to make" style="display: flex; align-items: center; gap: 2px; padding: 4px; background: #E2DCCD; border-radius: 14px">
          <button type="button" aria-label="Fewer" onClick="{{less}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #F5F1E6; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
          </button>
          <span aria-live="polite" style="min-width: 72px; text-align: center; font-weight: 600; font-size: 15px">{{servingsText}}</span>
          <button type="button" aria-label="More" onClick="{{more}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #F5F1E6; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </div>

      <div aria-live="polite" style="display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 12px; border-radius: 12px; background: #E8E3D5; font-size: 14px; font-weight: 600">
        <sc-for list="{{summary}}" as="m" hint-placeholder-count="2">
          <span style="display: flex; align-items: center; gap: 6px; color: {{m.color}}">
            <sc-if value="{{m.isCheck}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
            <sc-if value="{{m.isMinus}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M8.5 12h7"></path></svg></sc-if>
            <sc-if value="{{m.isBasket}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16l-1.5 9h-13z"></path><path d="m8 10 3-5M16 10l-3-5"></path></svg></sc-if>
            {{m.text}}
          </span>
        </sc-for>
      </div>

      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <li style="display: flex; flex-direction: column; border-top: {{r.borderTop}}">
            <div style="display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 64px; padding: 6px 0">
              <span style="font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; font-size: 17px">{{r.amount}}</span>
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 17px; line-height: 1.3">{{r.item}}<span style="color: #4E554B">{{r.noteText}}</span></span>
                <sc-if value="{{r.hasRecipe}}" hint-placeholder-val="{{false}}">
                  <a href="#simple-syrup" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 32px; font-size: 14px; font-weight: 600">{{r.recipeText}}
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
                  </a>
                </sc-if>
              </span>
              <sc-if value="{{r.isHave}}" hint-placeholder-val="{{true}}">
                <button type="button" aria-label="{{r.item}} is in the bar. Tap if you've run out." onClick="{{r.toggle}}" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 5px; border: 1.5px solid #1F4231; border-radius: 999px; background: #1F4231; color: #F2F5EE; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
                  In the bar
                </button>
              </sc-if>
              <sc-if value="{{r.isDont}}" hint-placeholder-val="{{false}}">
                <button type="button" aria-label="{{r.item}} is not in the bar. Tap when you have it." onClick="{{r.toggle}}" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 5px; border: 1.5px dashed #1E2621; border-radius: 999px; background: #FBF8F0; color: #1E2621; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M8.5 12h7"></path></svg>
                  Not in bar
                </button>
              </sc-if>
              <sc-if value="{{r.isFresh}}" hint-placeholder-val="{{false}}">
                <span style="display: flex; align-items: center; gap: 5px; padding: 0 6px; color: #6A460C; font-size: 14px; font-weight: 600; white-space: nowrap">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16l-1.5 9h-13z"></path><path d="m8 10 3-5M16 10l-3-5"></path></svg>
                  Fresh
                </span>
              </sc-if>
            </div>
            <sc-if value="{{r.showUndo}}" hint-placeholder-val="{{false}}">
              <div role="status" style="display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 4px 4px 4px 14px; border-radius: 12px; background: #1C2620; color: #EDE6D6; font-size: 14px">
                <span style="flex: 1">{{r.undoText}}</span>
                <button type="button" onClick="{{undo}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #9CC2A8; font-weight: 700; cursor: pointer">Undo</button>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-labelledby="dsteps-h" style="display: flex; flex-direction: column; gap: 16px">
      <h2 id="dsteps-h" style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">Method</h2>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px">
        <li style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #D3E0D2; color: #1F4231; display: flex; align-items: center; justify-content: center; font-family: 'Young Serif', Georgia, serif; font-size: 18px">1</span>
          <p style="margin: 7px 0 0; font-size: 17px; line-height: 1.55">Shake everything hard with ice.</p>
        </li>
        <li style="display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #D3E0D2; color: #1F4231; display: flex; align-items: center; justify-content: center; font-family: 'Young Serif', Georgia, serif; font-size: 18px">2</span>
          <p style="margin: 7px 0 0; font-size: 17px; line-height: 1.55">Double strain into a chilled coupe.</p>
        </li>
      </ol>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 1, st: { rum: 'have', syrup: 'dont' }, last: { id: 'syrup', prev: 'have' } };
  }
  renderVals() {
    const s = this.state;
    const defs = [
      { id: 'rum', amount: 50, item: 'white rum', shelf: true },
      { id: 'lime', amount: 25, item: 'lime juice', note: 'fresh', fresh: true },
      { id: 'syrup', amount: 15, item: 'simple syrup', note: '1:1', shelf: true, recipe: 'Simple syrup' }
    ];
    const fmt = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));
    const rows = defs.map((d, i) => {
      const v = d.shelf ? s.st[d.id] : 'fresh';
      return {
        amount: fmt(d.amount * s.n) + ' ml',
        item: d.item,
        noteText: d.note ? ', ' + d.note : '',
        borderTop: i === 0 ? 'none' : '1px solid #DDD6C5',
        isHave: v === 'have', isDont: v === 'dont', isFresh: v === 'fresh',
        hasRecipe: !!d.recipe,
        recipeText: v === 'dont' ? 'Out? Make it: ' + d.recipe : 'Recipe: ' + d.recipe,
        toggle: () => this.setState({ st: { ...this.state.st, [d.id]: v === 'have' ? 'dont' : 'have' }, last: { id: d.id, prev: v } }),
        showUndo: !!s.last && s.last.id === d.id,
        undoText: v === 'have' ? 'Marked as in the bar.' : 'Marked as not in the bar.'
      };
    });
    const shelf = defs.filter((d) => d.shelf);
    const missing = shelf.filter((d) => s.st[d.id] !== 'have').map((d) => d.item);
    const fresh = defs.filter((d) => d.fresh).map((d) => d.item);
    const summary = [];
    if (missing.length) summary.push({ text: 'Missing: ' + missing.join(', '), isMinus: true, color: '#1E2621' });
    else summary.push({ text: 'From your bar: ' + shelf.length + ' of ' + shelf.length, isCheck: true, color: '#1F4231' });
    if (fresh.length) summary.push({ text: 'Buy fresh: ' + fresh.join(', '), isBasket: true, color: '#6A460C' });
    return {
      rows,
      summary: summary.map((m) => ({ isCheck: !!m.isCheck, isMinus: !!m.isMinus, isBasket: !!m.isBasket, ...m })),
      servingsText: s.n === 1 ? '1 drink' : s.n + ' drinks',
      less: () => this.setState({ n: Math.max(1, s.n - 1) }),
      more: () => this.setState({ n: Math.min(12, s.n + 1) }),
      undo: () => this.setState({ st: { ...this.state.st, [s.last.id]: s.last.prev }, last: null })
    };
  }
}
</script>
</body>
</html>
