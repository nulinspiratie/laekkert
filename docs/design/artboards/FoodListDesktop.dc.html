<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food, list view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFE3}
a{color:#8E3E20}a:hover{color:#6E2E16}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5EFE3; color: #2A231E; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 14px 32px; background: #F9F4EA; border-bottom: 1px solid #E2D6C1">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B0502C" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18v10H3z"></path><path d="M6 10V5h12v5"></path><path d="M9 7.5h6"></path></svg>
      <span style="font-family: 'Young Serif', Georgia, serif; font-size: 22px">Recipes</span>
    </div>
    <nav aria-label="Food or drinks" style="display: flex; gap: 4px; padding: 4px; background: #EBE0CD; border-radius: 999px">
      <a href="FoodListDesktop.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 999px; background: #B0502C; color: #FFF8F1; text-decoration: none; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"></path><path d="M2 10h2M20 10h2M10 6h4"></path></svg>
        Food
      </a>
      <a href="DrinksDesktop.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 22px; border-radius: 999px; color: #5E5245; text-decoration: none; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14l-7 8z"></path><path d="M12 13v6M8 19h8"></path></svg>
        Drinks
      </a>
    </nav>
    <div style="flex: 1"></div>
    <div role="group" aria-label="View mode" style="display: flex; gap: 4px; padding: 4px; border: 1px solid #E2D6C1; border-radius: 12px; background: #FFFCF6">
      <a href="Main.dc.html" aria-label="Grid view" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 40px; border-radius: 8px; color: #5E5245">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
      </a>
      <a href="FoodListDesktop.dc.html" aria-label="List view" aria-current="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 40px; border-radius: 8px; background: #F1DDD0; color: #8E3E20">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.5M4.5 12h.5M4.5 18h.5"></path></svg>
      </a>
    </div>
    <a href="EditorDesktop.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; background: #B0502C; color: #FFF8F1; text-decoration: none; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New recipe
    </a>
    <div aria-label="Signed in as Serwan" role="img" style="width: 40px; height: 40px; border-radius: 50%; background: #2A231E; color: #F5EFE3; display: flex; align-items: center; justify-content: center; font-weight: 600">S</div>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: stretch; flex: 1">

    <aside aria-label="Food filters" style="flex: 1 1 260px; box-sizing: border-box; padding: 28px 24px 40px 32px; display: flex; flex-direction: column; gap: 28px; border-right: 1px solid #E2D6C1">
      <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: #FFFCF6; border: 1px solid #D9CBB4; border-radius: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#66594C" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search food</span>
        <input type="search" placeholder="Search food" style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 16px">
      </label>

      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Marks</h2>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3E20" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
          <span style="flex: 1">Favourite</span>
        </button>
        <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #F1DDD0; color: #7A3419; font-weight: 600; text-align: left; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M9 14.5c.8.9 1.8 1.4 3 1.4s2.2-.5 3-1.4"></path><circle cx="9.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><circle cx="14.5" cy="10" r="1" fill="currentColor" stroke="none"></circle></svg>
          <span style="flex: 1">Kid approved</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3E20" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg>
          <span style="flex: 1">Try next</span>
        </button>
      </section>

      <section style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Category</h2>
        <sc-for list="{{categories}}" as="c" hint-placeholder-count="6">
          <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #F1DDD0; color: #7A3419; font-weight: 600; text-align: left; cursor: pointer"><span>{{c.name}}</span><span style="font-size: 14px">{{c.n}}</span></button>
          </sc-if>
          <sc-if value="{{c.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer"><span>{{c.name}}</span><span style="font-size: 14px; color: #6B5D4F">{{c.n}}</span></button>
          </sc-if>
        </sc-for>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Tags</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
            <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1px solid #D9CBB4; border-radius: 999px; background: #FFFCF6; font-size: 15px; cursor: pointer">{{t}}</button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">Cook with what you have</h2>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 6px 0 14px; background: #FFFCF6; border: 1px solid #D9CBB4; border-radius: 12px">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add an ingredient</span>
          <input type="text" placeholder="Add an ingredient" style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 16px">
          <button type="button" aria-label="Add ingredient" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: #F1DDD0; color: #8E3E20; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </label>
        <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #66594C">Shows recipes that use every ingredient you add.</p>
      </section>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 56px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px">
        <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.05">Food</h1>
          <p style="margin: 0; font-size: 16px; color: #66594C">Kid approved, quickest first · 8 recipes</p>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #66594C">
          Sort
          <select style="min-height: 44px; padding: 0 36px 0 14px; border: 1px solid #D9CBB4; border-radius: 10px; background: #FFFCF6; font-size: 15px; color: #2A231E">
            <option>Cooking time</option>
            <option>Rating</option>
            <option>Recently made</option>
            <option>A–Z</option>
          </select>
        </label>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px 0 14px; border: 0; border-radius: 999px; background: #F1DDD0; color: #7A3419; font-weight: 600; font-size: 14px; cursor: pointer">
          Kid approved
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="Remove filter" role="img"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>

      <div style="background: #FFFCF6; border: 1px solid #E2D6C1; border-radius: 14px; overflow-x: auto">
        <div style="min-width: 640px; display: flex; flex-direction: column">
          <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 110px 90px 110px 24px; gap: 20px; align-items: center; padding: 12px 20px; border-bottom: 1px solid #E2D6C1; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6B5D4F">
            <span></span><span>Recipe</span><span>Time</span><span>Rating</span><span>Marks</span><span></span>
          </div>
          <sc-for list="{{recipes}}" as="r" hint-placeholder-count="8">
            <a href="RecipeDesktop.dc.html" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 110px 90px 110px 24px; gap: 20px; align-items: center; min-height: 76px; padding: 10px 20px; box-sizing: border-box; border-bottom: 1px solid #EFE6D6; text-decoration: none; color: #2A231E">
              <sc-if value="{{r.photo}}" hint-placeholder-val="{{true}}">
                <div role="img" aria-label="Photo of {{r.name}}" style="width: 56px; height: 56px; border-radius: 10px; background-color: {{r.tone}}; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 2px, transparent 2px 9px)"></div>
              </sc-if>
              <sc-if value="{{r.noPhoto}}" hint-placeholder-val="{{false}}">
                <div style="width: 56px; height: 56px; border-radius: 10px; background: #B0502C; color: #F6E2D4; display: flex; align-items: center; justify-content: center">
                  <sc-if value="{{r.isBowl}}" hint-placeholder-val="{{true}}"><svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 22h34a17 17 0 0 1-34 0z"></path><path d="M18 39h12"></path><path d="M19 16c0-3 3-3 3-6M26 16c0-3 3-3 3-6"></path></svg></sc-if>
                  <sc-if value="{{r.isPot}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 18h28v15a7 7 0 0 1-7 7H17a7 7 0 0 1-7-7z"></path><path d="M5 18h5M38 18h5M19 13h10M24 13v-3"></path></svg></sc-if>
                  <sc-if value="{{r.isPlate}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="25" r="12"></circle><circle cx="24" cy="25" r="7"></circle><path d="M6 12v7a3 3 0 0 0 3 3v15M9 12v7M42 12c-3 0-4 4-4 9h4v16"></path></svg></sc-if>
                </div>
              </sc-if>
              <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                <span style="font-family: 'Young Serif', Georgia, serif; font-size: 19px; line-height: 1.2">{{r.name}}</span>
                <span style="font-size: 14px; color: #66594C">{{r.cat}}</span>
              </div>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: #4F443A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 2"></path></svg>{{r.time}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: #4F443A"><svg width="16" height="16" viewBox="0 0 24 24" fill="#C98A2B" stroke="#C98A2B" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"></path></svg>{{r.rating}}</span>
              <span style="display: flex; gap: 8px; color: #8E3E20">
                <sc-if value="{{r.fav}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" role="img" aria-label="Favourite"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></sc-if>
                <sc-if value="{{r.kid}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" role="img" aria-label="Kid approved"><circle cx="12" cy="12" r="8"></circle><path d="M9 14.5c.8.9 1.8 1.4 3 1.4s2.2-.5 3-1.4"></path><circle cx="9.5" cy="10" r="1" fill="currentColor" stroke="none"></circle><circle cx="14.5" cy="10" r="1" fill="currentColor" stroke="none"></circle></svg></sc-if>
                <sc-if value="{{r.next}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" role="img" aria-label="Try next"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg></sc-if>
              </span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A8B7B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const recipes = [
      { name: 'Pannenkoeken', cat: 'Breakfast', time: '20 min', rating: '4.5', photo: true, tone: '#D7A95E', fav: true, kid: true },
      { name: 'Veggie quesadillas', cat: 'Mains', time: '20 min', rating: '4.0', photo: true, tone: '#C9A15A', kid: true },
      { name: 'Egg fried rice', cat: 'Mains', time: '25 min', rating: '4.0', icon: 'bowl', kid: true, next: true },
      { name: 'Fish fingers & smashed peas', cat: 'Mains', time: '25 min', rating: '3.5', photo: true, tone: '#9DAF6E', kid: true },
      { name: 'Red lentil dal', cat: 'Mains', time: '35 min', rating: '4.5', photo: true, tone: '#D08A3C', fav: true, kid: true },
      { name: 'Tomato soup & grilled cheese', cat: 'Soups', time: '35 min', rating: '4.0', icon: 'pot', kid: true },
      { name: 'Stamppot boerenkool', cat: 'Mains', time: '45 min', rating: '4.0', icon: 'plate', kid: true },
      { name: 'Sheet-pan chicken & potatoes', cat: 'Mains', time: '50 min', rating: '4.5', photo: true, tone: '#B9824B', fav: true, kid: true }
    ].map((r) => ({
      ...r,
      photo: !!r.photo,
      noPhoto: !r.photo,
      isBowl: r.icon === 'bowl',
      isPot: r.icon === 'pot',
      isPlate: r.icon === 'plate',
      fav: !!r.fav, kid: !!r.kid, next: !!r.next
    }));
    const categories = [
      { name: 'All', n: 42, on: true },
      { name: 'Mains', n: 24 },
      { name: 'Soups', n: 6 },
      { name: 'Breakfast', n: 5 },
      { name: 'Baking', n: 4 },
      { name: 'Sides', n: 3 }
    ].map((c) => ({ ...c, on: !!c.on, off: !c.on }));
    const tags = ['Weeknight', 'Vegetarian', 'One-pot', 'Freezer-friendly', 'Dutch', 'Mild'];
    return { recipes, categories, tags };
  }
}
</script>
</body>
</html>
