[project]
name = "app"
version = "0.1.0"
description = "Placeholder app from nas-app-template"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "starlette>=1.8",
    "uvicorn>=0.54",
]

[project.scripts]
app = "app.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
